name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v3.0.3
      - name: Assert installed version is v3.0.3
        run: |
          if ! command -v editorconfig-checker >/dev/null 2>&1; then
            echo "FAIL: editorconfig-checker not found on PATH"
            exit 1
          fi
          OUT="$(editorconfig-checker -version 2>&1 || true)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -q "3.0.3"; then
            echo "FAIL: expected version 3.0.3"
            exit 1
          fi
          echo "PASS"
