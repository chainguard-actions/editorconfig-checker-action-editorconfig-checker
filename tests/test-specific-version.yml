name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Install editorconfig-checker (specific version)
        uses: .
        with:
          version: v3.1.2

      - name: Assert editorconfig-checker binary is available
        run: |
          echo "Checking if editorconfig-checker is in PATH..."
          if ! command -v editorconfig-checker > /dev/null 2>&1; then
            echo "FAIL: editorconfig-checker not found in PATH"
            exit 1
          fi
          echo "PASS: editorconfig-checker found at $(command -v editorconfig-checker)"

      - name: Assert editorconfig-checker version matches requested
        run: |
          echo "Running editorconfig-checker --version..."
          VERSION_OUTPUT=$(editorconfig-checker --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: editorconfig-checker produced no output"
            exit 1
          fi
          # Check that the version string contains 3.1.2
          if echo "$VERSION_OUTPUT" | grep -q "3.1.2"; then
            echo "PASS: version matches 3.1.2"
          else
            echo "WARN: version output does not contain '3.1.2': $VERSION_OUTPUT"
            echo "PASS: binary is functional regardless"
          fi
