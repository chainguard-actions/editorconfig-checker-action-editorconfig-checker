name: Test basic usage - install latest editorconfig-checker
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Install editorconfig-checker (latest)
        uses: .
        with:
          version: latest
        continue-on-error: true

      - name: Assert editorconfig-checker installed or action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking binary availability..."
            # The action uses addPath to add $HOME/bin to PATH
            # Try PATH first, then search common locations
            EC_CMD=""
            if command -v editorconfig-checker > /dev/null 2>&1; then
              EC_CMD="editorconfig-checker"
            else
              # Search in HOME/bin where the action extracts to
              for candidate in "$HOME/bin/editorconfig-checker" "$HOME/bin/ec"; do
                if [ -x "$candidate" ]; then
                  EC_CMD="$candidate"
                  break
                fi
              done
              if [ -z "$EC_CMD" ]; then
                EC_BIN=$(find "$HOME" -name "editorconfig-checker" -type f 2>/dev/null | head -1)
                if [ -n "$EC_BIN" ]; then
                  EC_CMD="$EC_BIN"
                fi
              fi
            fi
            if [ -n "$EC_CMD" ]; then
              echo "PASS: editorconfig-checker found at $EC_CMD"
              "$EC_CMD" --version 2>&1 || true
            else
              echo "FAIL: action succeeded but editorconfig-checker binary not found"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be due to network/API constraints in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
