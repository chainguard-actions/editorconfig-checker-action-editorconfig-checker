name: Test basic usage - install latest editorconfig-checker
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
      - name: Assert editorconfig-checker is on PATH
        run: |
          echo "Checking if editorconfig-checker is available..."
          if ! command -v editorconfig-checker > /dev/null 2>&1; then
            echo "FAIL: editorconfig-checker not found on PATH"
            exit 1
          fi
          echo "PASS: editorconfig-checker is available at $(command -v editorconfig-checker)"
      - name: Assert editorconfig-checker runs successfully
        run: |
          echo "Running editorconfig-checker --version..."
          VERSION_OUTPUT=$(editorconfig-checker --version 2>&1 || true)
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: editorconfig-checker --version produced no output"
            exit 1
          fi
          echo "PASS: editorconfig-checker is functional"
