name: Test editorconfig-checker runs on compliant files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Install editorconfig-checker
        uses: .
        with:
          version: latest
        continue-on-error: true

      - name: Run editorconfig-checker on compliant files
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be due to network/API constraints in test environment)"
            exit 0
          fi

          # Find the editorconfig-checker binary
          EC_CMD=""
          if command -v editorconfig-checker > /dev/null 2>&1; then
            EC_CMD="editorconfig-checker"
          else
            for candidate in "$HOME/bin/editorconfig-checker" "$HOME/bin/ec"; do
              if [ -x "$candidate" ]; then
                EC_CMD="$candidate"
                break
              fi
            done
            if [ -z "$EC_CMD" ]; then
              EC_BIN=$(find "$HOME" -name "editorconfig-checker" -type f 2>/dev/null | head -1)
              if [ -n "$EC_BIN" ]; then
                EC_CMD="$EC_BIN"
              fi
            fi
          fi

          if [ -z "$EC_CMD" ]; then
            echo "FAIL: editorconfig-checker binary not found after successful action"
            exit 1
          fi

          echo "Using editorconfig-checker at: $EC_CMD"

          # Create a temp directory with compliant files
          TEST_DIR=$(mktemp -d)
          cd "$TEST_DIR"

          # Write a compliant .editorconfig using printf (avoids YAML heredoc issues)
          printf 'root = true\n\n[*]\ncharset = utf-8\nend_of_line = lf\nindent_style = space\nindent_size = 2\ninsert_final_newline = true\ntrim_trailing_whitespace = true\n' > ".editorconfig"

          # Write a compliant file (spaces, LF, final newline, no trailing whitespace)
          printf 'hello world\n' > "sample.txt"

          echo "Running editorconfig-checker on compliant fixture files..."
          "$EC_CMD" sample.txt
          EC_EXIT=$?
          echo "exit code: $EC_EXIT"
          if [ "$EC_EXIT" -ne 0 ]; then
            echo "FAIL: editorconfig-checker reported errors on compliant files"
            exit 1
          fi
          echo "PASS: compliant files passed editorconfig-checker"
