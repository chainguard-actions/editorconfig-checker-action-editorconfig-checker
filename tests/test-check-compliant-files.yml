name: Test editorconfig-checker runs on compliant files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: latest

      - name: Create a compliant test file and editorconfig
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/compliant"
          # Create an .editorconfig for the fixture directory
          cat > "$GITHUB_WORKSPACE/tests/fixtures/compliant/.editorconfig" << 'EOF'
          root = true

          [*]
          charset = utf-8
          end_of_line = lf
          indent_style = space
          indent_size = 2
          insert_final_newline = true
          trim_trailing_whitespace = true
          EOF
          # Normalize the editorconfig (remove leading spaces from heredoc)
          sed -i 's/^          //' "$GITHUB_WORKSPACE/tests/fixtures/compliant/.editorconfig"
          # Create a compliant file (LF endings, final newline, no trailing whitespace)
          printf 'hello world\n' > "$GITHUB_WORKSPACE/tests/fixtures/compliant/test.txt"

      - name: Assert editorconfig-checker passes on compliant files
        working-directory: tests/fixtures/compliant
        run: |
          echo "Running editorconfig-checker on compliant files..."
          if editorconfig-checker test.txt; then
            echo "PASS: editorconfig-checker passed on compliant file"
          else
            echo "FAIL: editorconfig-checker failed on a compliant file"
            exit 1
          fi
