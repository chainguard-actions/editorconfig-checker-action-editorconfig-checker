name: Test violation - editorconfig-checker detects violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a file that violates editorconfig rules
        run: |
          # Create a file with trailing whitespace (violates trim_trailing_whitespace = true)
          # and no final newline (violates insert_final_newline = true)
          # Place it in a location not excluded by .ecrc
          printf 'hello world   \nno final newline' > "$GITHUB_WORKSPACE/tests/bad-file.txt"

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action detected the violation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected editorconfig violations"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have detected violations in bad-file.txt"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Cleanup bad file
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/tests/bad-file.txt"
